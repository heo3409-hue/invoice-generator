<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator — DAEYANG ELECTRIC</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0f2d5c;
  --navy-light: #1a4a8a;
  --navy-pale: #e8f0fc;
  --bg: #f0f2f7;
  --surface: #ffffff;
  --border: #dde2ee;
  --text: #111827;
  --muted: #6b7280;
  --green: #15803d;
  --green-bg: #f0fdf4;
  --r: 10px; --rl: 16px;
}
body { font-family: 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* 헤더 */
.hdr {
  background: var(--navy);
  height: 64px; padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.hdr-left { display: flex; align-items: center; gap: 14px; }
.logo { background: #fff; color: var(--navy); font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 4px 10px; border-radius: 6px; }
.hdr h1 { font-size: 15px; font-weight: 600; color: #fff; }
.server-dot { display: flex; align-items: center; gap: 7px; font-size: 12px; color: rgba(255,255,255,0.7); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
.dot.ok { background: #4ade80; }
.dot.err { background: #f87171; }

/* 레이아웃 */
.layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 64px); }

/* 사이드바 */
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.sb-sec { padding: 20px 16px; border-bottom: 1px solid var(--border); }
.sb-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }

.cbtn {
  width: 100%; padding: 14px 16px; border-radius: var(--r);
  border: 2px solid transparent; background: transparent;
  display: flex; align-items: center; gap: 14px; text-align: left;
  cursor: pointer; transition: all .15s; font-family: inherit; margin-bottom: 6px;
}
.cbtn:hover { background: var(--bg); border-color: var(--border); }
.cbtn.active { background: var(--navy-pale); border-color: var(--navy-light); }
.cav {
  width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; letter-spacing: -0.5px;
}
.cn { font-size: 14px; font-weight: 700; line-height: 1.3; }
.cs { font-size: 12px; color: var(--muted); margin-top: 2px; }

.hist-item { padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--border); margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 12px; cursor: pointer; transition: background .12s; }
.hist-item:hover { background: var(--bg); }
.hno { font-weight: 700; color: var(--navy-light); font-size: 13px; }
.hamt { color: var(--green); font-weight: 700; }
.hdate { color: var(--muted); font-size: 11px; margin-top: 2px; }

/* 메인 */
.main { padding: 28px; overflow-y: auto; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
.welcome-icon { font-size: 64px; margin-bottom: 20px; opacity: .15; }
.welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.welcome p { font-size: 14px; color: var(--muted); line-height: 1.7; }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl); margin-bottom: 20px; overflow: hidden; }
.ch { padding: 16px 22px; border-bottom: 1px solid var(--border); background: #fafbfd; display: flex; align-items: center; gap: 12px; }
.ch h2 { font-size: 14px; font-weight: 700; flex: 1; }
.ci { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.cb { padding: 22px; }

/* 폼 */
.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fg4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }
.fg { display: flex; flex-direction: column; gap: 6px; }
.fg.s2 { grid-column: span 2; }
.fg.full { grid-column: 1/-1; }
label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
input, select, textarea {
  padding: 10px 13px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 14px; font-family: inherit;
  color: var(--text); background: var(--surface); outline: none;
  transition: border-color .15s, box-shadow .15s; width: 100%;
}
input:focus, select:focus { border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(26,74,138,.1); }
input[readonly] { background: var(--bg); color: var(--muted); cursor: default; }

/* 품목 테이블 */
.itbl { width: 100%; border-collapse: collapse; }
.itbl th { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); padding: 10px 10px; background: var(--bg); border-bottom: 2px solid var(--border); text-align: left; }
.itbl td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.itbl tr:last-child td { border-bottom: none; }
.itbl input { padding: 8px 10px; font-size: 13px; border: 1.5px solid var(--border); border-radius: 7px; }
.itbl input:focus { border-color: var(--navy-light); box-shadow: 0 0 0 2px rgba(26,74,138,.08); outline: none; }
.amt-c { font-weight: 700; color: var(--green); font-size: 14px; text-align: right; white-space: nowrap; }

/* 요약 */
.sgrid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-top: 16px; }
.sc { background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r); padding: 16px 18px; }
.sc.hi { background: var(--navy-pale); border-color: var(--navy-light); }
.slbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
.sval { font-size: 22px; font-weight: 800; }
.sc.hi .sval { color: var(--navy-light); }
.su { font-size: 12px; color: var(--muted); margin-left: 3px; font-weight: 400; }

/* 버튼 */
.actions { display: flex; gap: 10px; justify-content: flex-end; padding-bottom: 28px; }
.btn {
  padding: 12px 24px; border-radius: var(--r); font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit; display: flex; align-items: center;
  gap: 8px; border: none; transition: all .15s;
}
.btn-p { background: var(--navy); color: #fff; }
.btn-p:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15,45,92,.25); }
.btn-p:active { transform: translateY(0); box-shadow: none; }
.btn-p:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-s { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
.btn-s:hover { background: var(--bg); }

/* 모달 */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--rl); padding: 28px; width: 520px; max-width: 95vw; border: 1px solid var(--border); }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* 토스트 */
.toast { position: fixed; bottom: 24px; right: 24px; background: #111; color: #fff; padding: 12px 20px; border-radius: var(--r); font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: all .3s; z-index: 300; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.ok { background: var(--green); }
.toast.err { background: #dc2626; }

.add-btn { margin-top: 12px; padding: 9px 16px; background: transparent; border: 2px dashed var(--border); border-radius: var(--r); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); font-family: inherit; transition: all .15s; }
.add-btn:hover { border-color: var(--navy-light); color: var(--navy-light); background: var(--navy-pale); }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <span class="logo">DAEYANG ELECTRIC</span>
    <h1>Invoice &amp; Packing List Generator</h1>
  </div>
  <div class="server-dot">
    <div class="dot" id="sdot"></div>
    <span id="sstatus">연결 확인 중...</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-sec">
      <div class="sb-lbl">거래처 선택</div>
      <div id="clientList"></div>
      <button class="cbtn" style="border:2px dashed var(--border);justify-content:center;color:var(--muted);font-weight:600;font-size:13px;" onclick="openClientModal()">
        ＋ 거래처 추가
      </button>
    </div>
    <div class="sb-sec" style="flex:1">
      <div class="sb-lbl">최근 발행</div>
      <div id="histList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="welcome" id="welcomeMsg">
      <div class="welcome-icon">📋</div>
      <h2>거래처를 선택하세요</h2>
      <p>왼쪽에서 거래처를 선택하면<br>해당 양식이 자동으로 세팅됩니다.</p>
    </div>

    <div id="formWrap" style="display:none">

      <!-- 기본정보 -->
      <div class="card">
        <div class="ch">
          <div class="ci" style="background:var(--navy-pale)">📄</div>
          <h2>기본 정보</h2>
        </div>
        <div class="cb">
          <div class="fg4">
            <div class="fg"><label>Invoice No.</label><input id="f_no" /></div>
            <div class="fg"><label>Invoice Date</label><input id="f_date" type="date" /></div>
            <div class="fg"><label>L/C No. &amp; Date</label><input id="f_lc" placeholder="(선택)" /></div>
            <div class="fg"><label>P/O No. &amp; Date</label><input id="f_po" placeholder="(선택)" /></div>
            <div class="fg"><label>출발지 (From)</label><input id="f_from" value="Incheon, KOREA" /></div>
            <div class="fg"><label>도착지 (To)</label><input id="f_to" /></div>
            <div class="fg"><label>운송 방법</label>
              <select id="f_vessel"><option value="FLIGHT">AIR (FLIGHT)</option><option value="VESSEL">SEA (VESSEL)</option></select>
            </div>
            <div class="fg"><label>결제 조건</label>
              <select id="f_terms"><option>DDU</option><option>DDP</option><option>DAP</option><option>CIF</option><option>FOB</option><option>Ex Works</option></select>
            </div>
          </div>
        </div>
      </div>

      <!-- Consignee -->
      <div class="card">
        <div class="ch">
          <div class="ci" style="background:var(--navy-pale)">🏢</div>
          <h2>Consignee</h2>
        </div>
        <div class="cb">
          <div class="fg2">
            <div class="fg s2"><label>회사명</label><input id="f_cname" readonly /></div>
            <div class="fg"><label>담당자 (PIC)</label><input id="f_cpic" /></div>
            <div class="fg"><label>전화번호</label><input id="f_ctel" /></div>
            <div class="fg s2"><label>이메일</label><input id="f_cemail" /></div>
          </div>
        </div>
      </div>

      <!-- 품목 -->
      <div class="card">
        <div class="ch">
          <div class="ci" style="background:#f0fdf4">📦</div>
          <h2>품목 및 수량</h2>
        </div>
        <div class="cb">
          <div style="overflow-x:auto">
            <table class="itbl">
              <thead>
                <tr>
                  <th style="width:36px">No.</th>
                  <th>Model</th><th>Part No.</th><th>품목명</th>
                  <th style="width:120px">수량 (EA)</th>
                  <th style="width:100px">단가 (USD)</th>
                  <th style="width:120px">금액 (USD)</th>
                  <th style="width:32px"></th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
          <button class="add-btn" onclick="addItem()">＋ 품목 추가</button>
          <div class="sgrid">
            <div class="sc"><div class="slbl">총 수량</div><div class="sval" id="s_qty">0<span class="su">EA</span></div></div>
            <div class="sc"><div class="slbl">총 박스</div><div class="sval" id="s_box">0<span class="su">EA</span></div></div>
            <div class="sc"><div class="slbl">총 중량</div><div class="sval" id="s_wt">0<span class="su">kg</span></div></div>
            <div class="sc hi"><div class="slbl">총 금액</div><div class="sval" id="s_amt">$0</div></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-s" onclick="resetForm()">↺ 초기화</button>
        <button class="btn btn-p" id="dlBtn" onclick="download()" disabled>⬇ 엑셀 다운로드</button>
      </div>
    </div>
  </main>
</div>

<!-- 거래처 모달 -->
<div class="overlay" id="clientModal">
  <div class="modal">
    <h3>거래처 추가</h3>
    <div class="fg2" style="gap:14px">
      <div class="fg s2"><label>회사명 *</label><input id="m_name" /></div>
      <div class="fg"><label>국가</label><input id="m_country" /></div>
      <div class="fg"><label>도착지 (To)</label><input id="m_port" /></div>
      <div class="fg s2"><label>주소</label><textarea id="m_addr" rows="2" style="resize:none"></textarea></div>
      <div class="fg"><label>담당자 (PIC)</label><input id="m_pic" /></div>
      <div class="fg"><label>전화번호</label><input id="m_tel" /></div>
      <div class="fg s2"><label>이메일</label><input id="m_email" /></div>
      <div class="fg"><label>운송</label><select id="m_vessel"><option value="FLIGHT">AIR</option><option value="VESSEL">SEA</option></select></div>
      <div class="fg"><label>결제 조건</label><select id="m_terms"><option>DDU</option><option>DDP</option><option>DAP</option><option>CIF</option><option>FOB</option><option>Ex Works</option></select></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-s" onclick="closeModal()">취소</button>
      <button class="btn btn-p" onclick="saveClient()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENTS = [
  { id:'china', short:'중국만도', country:'China · DDU · AIR', color:'#dbeafe', fc:'#1e40af',
    name:'HL Mando (Suzhou) Automotive System Co., Ltd.',
    pic:'xianglan.liu', tel:'+86-138-1264-4198', email:'xianglan.liu@hlcompany.com',
    port:'Pudong, China', vessel:'FLIGHT', terms:'DDU',
    boxWt:100, trayWt:155, trayBoxes:12, palletWt:7200,
    items:[
      {model:'SM100',partNo:'BG6900Z000',name:'Pressure sensor',uprice:5.47,qpb:952,weight:5.2},
      {model:'SM110',partNo:'BG69003800',name:'Pressure sensor',uprice:4.27,qpb:1034,weight:5.2}
    ]
  },
  { id:'mexico', short:'멕시코만도', country:'Mexico · CIF · SEA', color:'#dcfce7', fc:'#166534',
    name:'HL MANDO CORPORATION MEXICO SA DE CV',
    pic:'DONGWOOK KIM', tel:'+52 81 3416 1187', email:'KIMDONG.WOOK@HLCOMPANY.COM',
    port:'MEXICO', vessel:'VESSEL', terms:'CIF',
    boxWt:800, trayWt:155, trayBoxes:11, palletWt:7000,
    items:[
      {model:'SM100',partNo:'BG6900Z000',name:'Pressure sensor',uprice:5.42,qpb:2068,weight:5.2},
      {model:'SM110',partNo:'BG69003800',name:'Pressure sensor',uprice:4.27,qpb:1034,weight:5.2}
    ]
  },
  { id:'nasn', short:'NASN', country:'China · DAP · SEA', color:'#f3e8ff', fc:'#6b21a8',
    name:'Shanghai Mingxuan International Trade CO., LTD',
    pic:'徐彩妮Annie', tel:'+86-18916480406', email:'xucaini@shanghaimingxuan.com',
    port:'Shanghai, China', vessel:'VESSEL', terms:'DAP',
    boxWt:800, trayWt:155, trayBoxes:11, palletWt:7200,
    items:[{model:'SNA120',partNo:'SNA120',name:'Pressure sensor (SNA120)',uprice:3.238,qpb:1034,weight:5.2}]
  },
  { id:'india', short:'인도만도', country:'India · Ex Works · AIR', color:'#fef3c7', fc:'#92400e',
    name:'HL Mando ANAND INDIA PVT LTD.',
    pic:'rameshkumar.p', tel:'+91-9962434766', email:'rameshkumar.p@hlcompany.com',
    port:'India', vessel:'FLIGHT', terms:'Ex Works',
    boxWt:850, trayWt:190, trayBoxes:12, palletWt:7200,
    items:[
      {model:'SM100',partNo:'BG6900Z000',name:'SM100 Pressure sensor (BG6900Z000)',uprice:5.35,qpb:517,weight:5.2},
      {model:'SM110',partNo:'BG69003800',name:'SM110 Pressure sensor (BG69003800)',uprice:4.25,qpb:517,weight:5.2}
    ]
  }
];

let clients = JSON.parse(localStorage.getItem('dye_clients3') || 'null') || CLIENTS;
let history = JSON.parse(localStorage.getItem('dye_hist3') || '[]');
let sel = null, items = [];
const SERVER = window.location.origin;
let serverOk = false;

async function checkServer() {
  try {
    const r = await fetch(SERVER+'/health', {signal: AbortSignal.timeout(3000)});
    serverOk = r.ok;
  } catch { serverOk = false; }
  document.getElementById('sdot').className = 'dot' + (serverOk ? ' ok' : ' err');
  document.getElementById('sstatus').textContent = serverOk ? '서버 연결됨' : '서버 미연결';
}
setInterval(checkServer, 5000); checkServer();

function renderClients() {
  const el = document.getElementById('clientList');
  el.innerHTML = '';
  clients.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cbtn' + (sel?.id === c.id ? ' active' : '');
    b.innerHTML = `<div class="cav" style="background:${c.color};color:${c.fc}">${c.short.slice(0,2)}</div>
      <div><div class="cn">${c.short}</div><div class="cs">${c.country}</div></div>`;
    b.onclick = () => selectClient(c);
    el.appendChild(b);
  });
}

function renderHistory() {
  const el = document.getElementById('histList');
  el.innerHTML = '';
  const list = [...history].reverse().slice(0,8);
  if (!list.length) { el.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px">발행 내역 없음</div>'; return; }
  list.forEach(h => {
    const d = document.createElement('div');
    d.className = 'hist-item';
    d.innerHTML = `<div><div class="hno">${h.no}</div><div class="hdate">${h.client}</div></div>
      <div style="text-align:right"><div class="hdate">${h.date}</div><div class="hamt">$${Number(h.amt).toLocaleString()}</div></div>`;
    el.appendChild(d);
  });
}

function selectClient(c) {
  sel = c;
  renderClients();
  document.getElementById('welcomeMsg').style.display = 'none';
  document.getElementById('formWrap').style.display = 'block';
  document.getElementById('dlBtn').disabled = false;
  const today = new Date();
  document.getElementById('f_date').value = today.toISOString().split('T')[0];
  document.getElementById('f_no').value = makeNo(today);
  document.getElementById('f_lc').value = '';
  document.getElementById('f_po').value = c.id==='nasn' ? 'CGDD2512177314' : '';
  document.getElementById('f_from').value = 'Incheon, KOREA';
  document.getElementById('f_to').value = c.port;
  document.getElementById('f_vessel').value = c.vessel;
  document.getElementById('f_terms').value = c.terms;
  document.getElementById('f_cname').value = c.name;
  document.getElementById('f_cpic').value = c.pic;
  document.getElementById('f_ctel').value = c.tel;
  document.getElementById('f_cemail').value = c.email;
  items = c.items.map((it,i) => ({...it, id:i, qty:0}));
  renderItems(); calcSummary();
}

function makeNo(d) {
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const pfx = `TS-${yy}${mm}${dd}-`;
  return pfx + String(history.filter(h=>h.no.startsWith(pfx)).length+1).padStart(2,'0');
}

function renderItems() {
  const tb = document.getElementById('itemsBody');
  tb.innerHTML = '';
  items.forEach((it, idx) => {
    const amt = (it.qty * it.uprice).toFixed(2);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align:center;color:var(--muted);font-size:12px;font-weight:600">${idx+1}</td>
      <td><input value="${it.model||''}" oninput="upd(${it.id},'model',this.value)" placeholder="SM100" /></td>
      <td><input value="${it.partNo||''}" oninput="upd(${it.id},'partNo',this.value)" style="font-family:monospace;font-size:12px" /></td>
      <td><input value="${it.name||''}" oninput="upd(${it.id},'name',this.value)" /></td>
      <td><input type="number" value="${it.qty||''}" oninput="upd(${it.id},'qty',+this.value)" style="text-align:right" placeholder="0" /></td>
      <td><input type="number" value="${it.uprice}" step="0.001" oninput="upd(${it.id},'uprice',+this.value)" style="text-align:right" /></td>
      <td class="amt-c" id="a${it.id}">$${Number(amt).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td>${items.length>1?`<button onclick="removeItem(${it.id})" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:18px;font-weight:700;padding:2px 6px;">×</button>`:''}</td>`;
    tb.appendChild(tr);
  });
}

function upd(id, f, v) {
  const it = items.find(i=>i.id===id); if(!it) return;
  it[f] = v;
  const el = document.getElementById('a'+id);
  if(el) el.textContent = '$'+(it.qty*it.uprice).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  calcSummary();
}

function addItem() {
  items.push({id:Date.now(),model:'',partNo:'',name:'',qty:0,uprice:0,qpb:0,weight:5.2});
  renderItems(); calcSummary();
}

function removeItem(id) { items=items.filter(i=>i.id!==id); renderItems(); calcSummary(); }

function calcSummary() {
  if(!sel) return;
  let tQ=0,tB=0,tN=0,tA=0;
  items.forEach(it=>{tQ+=it.qty; if(it.qpb>0)tB+=Math.round(it.qty/it.qpb); tN+=it.qty*it.weight; tA+=it.qty*it.uprice;});
  const tT=tB>0?Math.ceil(tB/sel.trayBoxes):0;
  const tP=Math.max(1,Math.ceil(tB/27));
  const gG=tN+tB*sel.boxWt+tT*sel.trayWt+tP*sel.palletWt;
  document.getElementById('s_qty').innerHTML=tQ.toLocaleString()+'<span class="su">EA</span>';
  document.getElementById('s_box').innerHTML=tB+'<span class="su">EA</span>';
  document.getElementById('s_wt').innerHTML=(gG/1000).toFixed(2)+'<span class="su">kg</span>';
  document.getElementById('s_amt').textContent='$'+tA.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function resetForm() { if(sel) selectClient(sel); }

async function download() {
  if(!sel) return;
  const invNo=document.getElementById('f_no').value;
  const date=document.getElementById('f_date').value;
  const payload={client_id:sel.id,inv_no:invNo,date,items:items.map(it=>({qty:it.qty,uprice:it.uprice}))};
  const btn=document.getElementById('dlBtn');
  btn.disabled=true; btn.textContent='생성 중...';
  try {
    const r=await fetch(SERVER+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('서버 오류');
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=invNo+'.xlsx'; a.click();
    URL.revokeObjectURL(url);
    const tA=items.reduce((s,it)=>s+it.qty*it.uprice,0);
    history.push({no:invNo,date,client:sel.short,amt:parseFloat(tA.toFixed(2))});
    localStorage.setItem('dye_hist3',JSON.stringify(history));
    renderHistory();
    toast('✓ '+invNo+'.xlsx 다운로드 완료','ok');
  } catch(e){ toast('오류: '+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='⬇ 엑셀 다운로드'; }
}

function openClientModal() {
  ['m_name','m_country','m_port','m_addr','m_pic','m_tel','m_email'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('clientModal').classList.add('open');
}
function closeModal() { document.getElementById('clientModal').classList.remove('open'); }
function saveClient() {
  const name=document.getElementById('m_name').value.trim();
  if(!name){toast('회사명을 입력하세요','err');return;}
  const c={id:'c'+Date.now(),short:name.slice(0,6),country:document.getElementById('m_country').value,
    color:'#f1f5f9',fc:'#334155',name,pic:document.getElementById('m_pic').value,
    tel:document.getElementById('m_tel').value,email:document.getElementById('m_email').value,
    port:document.getElementById('m_port').value,vessel:document.getElementById('m_vessel').value,
    terms:document.getElementById('m_terms').value,
    boxWt:800,trayWt:155,trayBoxes:12,palletWt:7200,items:[]};
  clients.push(c);
  localStorage.setItem('dye_clients3',JSON.stringify(clients));
  closeModal(); renderClients(); toast('거래처 저장 완료','ok');
}

function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>t.className='toast',3500);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('clientModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
renderClients(); renderHistory();
</script>
</body>
</html>
